<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DemoLineManager - 仓库管理系统</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- 首帧前应用收起态，避免换页闪动（与旧逻辑 dlm-collapsed 兼容） -->
    <script>
      try {
        if (localStorage.getItem('dlm-collapsed') === '1') {
          document.documentElement.classList.add('collapsed');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
